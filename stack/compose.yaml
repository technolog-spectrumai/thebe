# JupyterLab, the statistics dashboard and its package runner, and the AI gateway, the first
# two published only on the Tailscale IPv4. Every ${...} value comes from the .env next to this file, written by
# setup-jupyterlab-tailscale.sh. Passwords never pass through interpolation: they are
# files under ./secrets/, mounted as Compose secrets.
name: jupyterlab-tailscale

services:
  jupyterlab:
    image: jupyterlab-tailscale/jupyterlab:local
    # Built locally: never ask a registry for this tag, build it when it is missing.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyterlab
      args:
        JLT_UID: "${JLT_UID:-1000}"
        JLT_GID: "${JLT_GID:-1000}"
    restart: unless-stopped
    # tini as PID 1 reaps orphaned kernel and terminal processes.
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ports:
      # The :? guard stops Compose when TS_IP is unset or empty; an empty host part
      # would publish the port on 0.0.0.0.
      - "${TS_IP:?Tailscale IPv4 missing - run setup-jupyterlab-tailscale.sh start}:${JUPYTER_PORT:?}:8888"
    environment:
      HOME: /home/jupyter
      # Config, data, lab settings and IPython profile persist on the jupyter_state
      # volume; the runtime dir (connection files, sockets) stays ephemeral.
      JUPYTER_CONFIG_DIR: /state/config
      JUPYTER_DATA_DIR: /state/data
      JUPYTER_RUNTIME_DIR: /tmp/jupyter-runtime
      JUPYTERLAB_SETTINGS_DIR: /state/lab/user-settings
      JUPYTERLAB_WORKSPACES_DIR: /state/lab/workspaces
      IPYTHONDIR: /state/ipython
      # The %%ai magic in the kernels (and so the AI cell button) asks the AI gateway, never a
      # provider: the API keys stay in the ai container. With AI off the magic says so.
      AI_GATEWAY_URL: http://ai:8891
      AI_TOKEN_FILE: /run/secrets/ai_token
    secrets:
      - jupyter_hashed_password
      - ai_token
    networks:
      - default
      - ai
    volumes:
      # Long syntax so a missing host directory is an error; the short syntax would
      # let the daemon create it owned by root. The :? guard matters: an empty source
      # resolves to the project directory itself (the app dir with secrets/).
      - type: bind
        source: "${WORKSPACE_DIR:?WORKSPACE_DIR missing - run setup-jupyterlab-tailscale.sh install}"
        target: /workspace
        bind:
          create_host_path: false
      - jupyter_state:/state
      # Packages installed by the deps service; kernels add its venv to sys.path
      # (kernel_launcher.py). Read-only: only the runner changes it.
      - type: volume
        source: custom_packages
        target: /opt/custom
        read_only: true
    healthcheck:
      # GET /api is unauthenticated in jupyter_server; the slim image has no curl. The
      # script follows HTTP or HTTPS (compose.tls.yaml).
      test: ["CMD", "python", "/srv/jupyter/jupyter_healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    # Time for kernels to shut down cleanly before SIGKILL.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Package runner behind the dashboard's Dependencies page. It runs the JupyterLab image,
  # so pip sees exactly the packages notebooks have, but without the workspace, the Jupyter
  # state or a published port: pip (and the build scripts of the packages it installs)
  # only reaches the two package volumes. The stats container, which has the host's /proc
  # and /sys, never runs pip.
  deps:
    # The jupyterlab service builds this image; deps only reuses it (no build section).
    image: jupyterlab-tailscale/jupyterlab:local
    pull_policy: never
    profiles:
      - stats
    command: ["python", "/srv/jupyter/deps_runner.py"]
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
    environment:
      STATS_USER: "${STATS_USER:-jupyter}"
      DEPS_TOKEN_FILE: /run/secrets/deps_token
      CUSTOM_DIR: /opt/custom
      PIP_CACHE_DIR: /var/cache/pip
      HOME: /tmp
    # Only the runner token, never jupyter_password or its hash: build scripts of the
    # packages pip installs run here and can read whatever the runner can.
    secrets:
      - deps_token
    volumes:
      - custom_packages:/opt/custom
      - pip_cache:/var/cache/pip
    healthcheck:
      # /health requires Basic auth like every route of the runner.
      test: ["CMD", "python", "/srv/jupyter/deps_healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    # A running pip job is cancelled (SIGTERM, SIGKILL after 10 s) before the runner exits.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  stats:
    image: jupyterlab-tailscale/stats:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: stats
      args:
        JLT_UID: "${JLT_UID:-1000}"
        JLT_GID: "${JLT_GID:-1000}"
    # Enabled by COMPOSE_PROFILES='stats' in .env.
    profiles:
      - stats
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - "/tmp:size=64m"
    ports:
      - "${TS_IP:?Tailscale IPv4 missing - run setup-jupyterlab-tailscale.sh start}:${STATS_PORT:?}:8889"
    environment:
      STATS_USER: "${STATS_USER:-jupyter}"
      JUPYTER_PASSWORD_FILE: /run/secrets/jupyter_password
      # compose.tls.yaml switches this to https.
      JUPYTER_INTERNAL_URL: http://jupyterlab:8888
      # Links as the browser sees them: the MagicDNS name when there is one, https when a
      # certificate is in use (PUBLIC_* from .env; the defaults cover an older .env).
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-http}"
      JUPYTER_PUBLIC_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-${TS_IP}}:${JUPYTER_PORT}/lab"
      STATS_PUBLIC_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-${TS_IP}}:${STATS_PORT}/"
      # The Dependencies page proxies to the runner; it copes with the runner being down.
      DEPS_INTERNAL_URL: http://deps:8890
      DEPS_TOKEN_FILE: /run/secrets/deps_token
      # The AI tile (token budget, answer times) reads the gateway's /status. AI_ENABLED='0' (no
      # ai: section in config.yaml) shows AI as off instead of as unreachable.
      AI_ENABLED: "${AI_ENABLED:-0}"
      AI_INTERNAL_URL: http://ai:8891
      AI_TOKEN_FILE: /run/secrets/ai_token
      HOST_NAME: "${HOST_NAME:-}"
      # zenobia theme file under /srv/stats/theme (stack/theme), without .json. Environment
      # only: switching themes recreates this container, nothing is rebuilt.
      THEME: "${THEME:-amazing}"
      # Host /proc and /sys, read-only, for host-wide CPU, memory, network and sensors.
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      WORKSPACE_DIR: /workspace
    secrets:
      - jupyter_password
      - deps_token
      - ai_token
    networks:
      - default
      - ai
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
        bind:
          create_host_path: false
      # Read-only, only for disk usage of the workspace filesystem.
      - type: bind
        source: "${WORKSPACE_DIR:?WORKSPACE_DIR missing - run setup-jupyterlab-tailscale.sh install}"
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      jupyterlab:
        condition: service_started
      deps:
        condition: service_started
    healthcheck:
      # /health requires Basic auth like every route; the script sends the header.
      test: ["CMD", "python", "/srv/stats/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # AI gateway: the only container with the AI API keys (secret ai_config). It calls OpenAI and
  # Anthropic for the %%ai magic, counts the tokens against the budget and times the answers.
  # Only jupyterlab and stats share its network, with the ai_token; deps (where pip runs the
  # build scripts of third-party packages) cannot reach it. No published port.
  ai:
    image: jupyterlab-tailscale/ai:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: ai
      args:
        JLT_UID: "${JLT_UID:-1000}"
        JLT_GID: "${JLT_GID:-1000}"
    # Enabled by COMPOSE_PROFILES in .env when config.yaml has an ai: section.
    profiles:
      - ai
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - "/tmp:size=16m"
    environment:
      AI_CONFIG_FILE: /run/secrets/ai_config
      AI_TOKEN_FILE: /run/secrets/ai_token
      AI_DATA_DIR: /var/lib/thebe-ai
      HOME: /tmp
      # Changes with the AI settings, so Compose recreates this container after an update that
      # changed them (it does not notice a changed secret file by itself).
      AI_CONFIG_HASH: "${AI_CONFIG_HASH:-}"
    secrets:
      - ai_config
      - ai_token
    volumes:
      # usage.jsonl: tokens and seconds of every answer (never a prompt), for the budget.
      - ai_usage:/var/lib/thebe-ai
    networks:
      - ai
    healthcheck:
      # /health requires the bearer token like every route; the script sends it.
      test: ["CMD", "python", "/srv/ai/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    # Answers being written are finished (and counted) before the gateway exits.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# File secrets are read-only bind mounts at /run/secrets/<name>. Compose ignores
# uid/gid/mode for them, so the files keep their host owner (the desktop user, same uid
# as the container user) and mode 0600.
secrets:
  jupyter_hashed_password:
    file: ./secrets/jupyter_hashed_password
  jupyter_password:
    file: ./secrets/jupyter_password
  # Random credential between stats and deps, created once by the installer.
  deps_token:
    file: ./secrets/deps_token
  # config.yaml's ai: section with the API keys, for the ai container only; {} when AI is off.
  ai_config:
    file: ./secrets/ai_config
  # Random credential for the AI gateway, shared with jupyterlab and stats; created once.
  ai_token:
    file: ./secrets/ai_token

networks:
  default:
  # The AI gateway's network: ai, jupyterlab and stats. Not internal: the gateway needs the
  # providers' APIs on the internet.
  ai:

volumes:
  jupyter_state:
  # /opt/custom: venv, requirements.txt, job state and log of the deps runner.
  custom_packages:
  # pip's download cache, written only by the deps runner.
  pip_cache:
  # The AI gateway's usage ledger (token budget and answer times).
  ai_usage:
