# Thebe configuration, read by the builder (./run-builder.sh) and the headless runner (./run.sh).
# Both check it and write the installer's settings file (.env) from it: edit this file, not the .env.
# Deploy in the builder rewrites it (comments of your own are not kept). Keep it private (mode 600).

jupyter:
  # Password of JupyterLab and the dashboard: 8 to 128 characters, no single quote or backslash.
  password: "TailLab-7mK9-vQ2x-N4pR!"
  port: 8888

stats:
  # The statistics dashboard and the Dependencies page (HTTP Basic: this user and the password).
  enabled: true
  port: 8889
  user: "jupyter"

# Colours of the dashboard and the builder: a file name from stack/theme without .json.
theme: "amazing"

# auto: HTTPS on the Tailscale name when the tailnet allows it; off: plain HTTP.
https: "auto"

# NVIDIA GPU for the notebooks: true expects one (install and start fail when Docker cannot
# use it), false never uses one (for machines without NVIDIA), auto uses it when it works.
nvidia: auto

# The notebook workspace on this machine (/workspace in JupyterLab). Default: ~/jupyter-workspace.
# workspace: "~/jupyter-workspace"

# Up to 7 host directories (scripts, tools) COPIED into <workspace>/imported/<name>/ on install
# and Deploy, before JupyterLab starts. A plain copy: no link to the source, symbolic links are
# skipped, nothing is deleted. <name> is the directory's own name; set it when two share one:
#   - "~/tools"
#   - path: "/opt/lab/tools"
#     name: "lab-tools"
import_dirs: []

# AI code generation in notebooks: the %%ai magic and the AI button in the toolbars.
# The keys are read from this file on install and update (Deploy in the builder) only. They
# reach the AI gateway container, never notebooks or the browser. The budget counts the input
# and output tokens of all providers together; the Statistics page shows how much is left.
# ai:
#   default: "claude"              # what a plain %%ai uses; the others by name: %%ai openai
#   providers:
#     claude:
#       api: "anthropic"
#       model: "claude-sonnet-5"
#       api_key: "sk-ant-..."
#     openai:
#       api: "openai"
#       model: "gpt-5.4-mini"
#       api_key: "sk-..."
#   budget:
#     max_tokens: 1000000          # 0 = no limit
#     period: "month"              # month: starts again on the 1st (UTC); total: never
#   timeout: 60                    # seconds to wait for one answer
#   max_output_tokens: 2048        # the longest answer, in tokens
